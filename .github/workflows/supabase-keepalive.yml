# Keeps the free-plan Supabase project (seg-leads-agent) from pausing.
# Free projects pause after about a week with no activity; this calls the database every Monday.
# Needs repository secrets SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY.
# The repo is public, so nothing from the response is printed: logs show only pass or fail.

name: Supabase keep-alive

on:
  schedule:
    - cron: "17 13 * * 1"   # Mondays 13:17 UTC (9:17 a.m. Eastern in summer, 8:17 in winter)
  workflow_dispatch: {}      # "Run workflow" button for a manual test

permissions: {}              # this job needs no access to the repo itself

concurrency:
  group: supabase-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_KEY}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY secret is missing"
            exit 1
          fi

          # Older keys (start with eyJ) also need the Authorization header; newer sb_secret_ keys do not.
          auth=()
          case "${SUPABASE_KEY}" in
            eyJ*) auth=(-H "Authorization: Bearer ${SUPABASE_KEY}") ;;
          esac

          for attempt in 1 2 3; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -X POST "${SUPABASE_URL%/}/rest/v1/rpc/keepalive" \
              -H "apikey: ${SUPABASE_KEY}" "${auth[@]}" \
              -H "Content-Type: application/json" \
              -d '{}') || status="000"
            if [ "${status}" = "200" ]; then
              echo "Supabase is awake (attempt ${attempt})."
              exit 0
            fi
            echo "Attempt ${attempt} returned HTTP ${status}; retrying in 20 seconds."
            sleep 20
          done

          echo "::error::Supabase keep-alive failed after 3 attempts (last HTTP ${status})."
          exit 1
